<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Train" />
  <title>Train</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0A0A0F; overscroll-behavior: none; }
    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const WORKOUTS = {
      "Upper A": {
        day: "Monday", focus: "Push", color: "#FF6B35",
        exercises: [
          { name: "Barbell / DB Bench Press", sets: 3, reps: "6–8", notes: "Heavy, controlled" },
          { name: "Overhead Press (BB or DB)", sets: 3, reps: "8–10", notes: "" },
          { name: "Incline DB Press", sets: 2, reps: "10–12", notes: "" },
          { name: "Cable Lateral Raise", sets: 3, reps: "12–15", notes: "" },
          { name: "Tricep Pushdown", sets: 2, reps: "12–15", notes: "" },
          { name: "Face Pulls", sets: 2, reps: "15", notes: "Shoulder health — don't skip" },
        ],
      },
      "Lower A": {
        day: "Wednesday", focus: "Quad", color: "#4ECDC4",
        exercises: [
          { name: "Barbell Back Squat", sets: 4, reps: "6–8", notes: "Primary stimulus" },
          { name: "Leg Press", sets: 3, reps: "10–12", notes: "Volume without CNS cost" },
          { name: "Bulgarian Split Squat", sets: 2, reps: "10 each", notes: "Unilateral balance" },
          { name: "Leg Curl (machine)", sets: 3, reps: "10–12", notes: "" },
          { name: "Calf Raise", sets: 3, reps: "15", notes: "" },
          { name: "Ab Work", sets: 2, reps: "Failure", notes: "Planks, dead bugs" },
        ],
      },
      "Upper B": {
        day: "Friday", focus: "Pull", color: "#A855F7",
        exercises: [
          { name: "Pull-ups / Lat Pulldown", sets: 4, reps: "6–8", notes: "Weighted if bodyweight is easy" },
          { name: "Barbell / Cable Row", sets: 3, reps: "8–10", notes: "" },
          { name: "Single-arm DB Row", sets: 2, reps: "10–12 each", notes: "" },
          { name: "Rear Delt Fly", sets: 3, reps: "12–15", notes: "" },
          { name: "Barbell / DB Curl", sets: 3, reps: "10–12", notes: "" },
          { name: "Hammer Curl", sets: 2, reps: "12", notes: "" },
        ],
      },
      "Lower B": {
        day: "Saturday", focus: "Hinge", color: "#22C55E",
        exercises: [
          { name: "Romanian Deadlift", sets: 4, reps: "6–8", notes: "Primary stimulus" },
          { name: "Hip Thrust", sets: 3, reps: "10–12", notes: "Glute activation often undertrained" },
          { name: "Walking Lunges", sets: 2, reps: "12 each", notes: "" },
          { name: "Leg Curl (machine)", sets: 3, reps: "10–12", notes: "" },
          { name: "Single-leg Calf Raise", sets: 2, reps: "15", notes: "" },
          { name: "Ab Work", sets: 2, reps: "Failure", notes: "Hollow holds, cable crunches" },
        ],
      },
    };

    const STORAGE_KEY = "workout_log_v1";
    const loadLog = () => { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; } };
    const saveLog = (log) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); } catch {} };
    const todayStr = () => new Date().toISOString().slice(0, 10);

    function App() {
      const [screen, setScreen] = useState("home");
      const [activeWorkout, setActiveWorkout] = useState(null);
      const [sessionData, setSessionData] = useState({});
      const [completedSets, setCompletedSets] = useState({});
      const [sessionNote, setSessionNote] = useState("");
      const [log, setLog] = useState(loadLog);
      const [viewSession, setViewSession] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => { saveLog(log); }, [log]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

      const startWorkout = (name) => {
        setActiveWorkout(name);
        const init = {};
        WORKOUTS[name].exercises.forEach((ex, i) => {
          init[i] = Array.from({ length: ex.sets }, () => ({ weight: "", reps: "" }));
        });
        setSessionData(init);
        setCompletedSets({});
        setSessionNote("");
        setScreen("workout");
      };

      const updateSet = (exIdx, setIdx, field, value) => {
        setSessionData(prev => {
          const copy = { ...prev };
          copy[exIdx] = copy[exIdx].map((s, i) => i === setIdx ? { ...s, [field]: value } : s);
          return copy;
        });
      };

      const toggleSetDone = (exIdx, setIdx) => {
        const key = `${exIdx}-${setIdx}`;
        setCompletedSets(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const finishWorkout = () => {
        const date = todayStr();
        const entry = {
          workout: activeWorkout,
          date,
          note: sessionNote,
          exercises: WORKOUTS[activeWorkout].exercises.map((ex, i) => ({
            name: ex.name,
            sets: sessionData[i],
          })),
        };
        setLog(prev => {
          const n = { ...prev };
          if (!n[date]) n[date] = [];
          n[date].push(entry);
          return n;
        });
        showToast("Session saved ✓");
        setScreen("home");
      };

      const totalSessions = () => Object.values(log).reduce((a, b) => a + b.length, 0);

      const recentSessions = () => {
        const all = [];
        Object.entries(log).forEach(([date, sessions]) => sessions.forEach(s => all.push({ ...s, date })));
        return all.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30);
      };

      const monthCount = () => {
        const d = new Date();
        let count = 0;
        for (let i = 0; i < 30; i++) {
          const ds = d.toISOString().slice(0, 10);
          if (log[ds]) count += log[ds].length;
          d.setDate(d.getDate() - 1);
        }
        return count;
      };

      const w = activeWorkout ? WORKOUTS[activeWorkout] : null;
      const accent = w?.color || "#FF6B35";

      const css = {
        app: { fontFamily: "-apple-system,'SF Pro Display','Helvetica Neue',sans-serif", background: "#0A0A0F", minHeight: "100dvh", color: "#F0F0F5", maxWidth: 430, margin: "0 auto", position: "relative", paddingBottom: 88 },
        header: { padding: "env(safe-area-inset-top, 44px) 20px 16px", paddingTop: "max(env(safe-area-inset-top,44px), 44px)", background: "linear-gradient(180deg,#12121A 0%,#0A0A0F 100%)" },
        label: { fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#555", marginBottom: 4 },
        title: { fontSize: 30, fontWeight: 700, letterSpacing: "-0.5px" },
        statRow: { display: "flex", gap: 10, marginBottom: 20 },
        stat: { flex: 1, background: "#16161E", borderRadius: 14, padding: "14px 10px", textAlign: "center" },
        statNum: (c) => ({ fontSize: 28, fontWeight: 700, letterSpacing: "-0.5px", color: c }),
        statLbl: { fontSize: 10, color: "#555", textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 2 },
        sectionTitle: { fontSize: 12, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "#444", marginBottom: 10, marginTop: 22, paddingLeft: 2 },
        wCard: (c) => ({ background: "#16161E", borderRadius: 20, padding: "18px 20px", marginBottom: 12, borderLeft: `3px solid ${c}`, cursor: "pointer", WebkitUserSelect: "none" }),
        dayLbl: { fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "#555", marginBottom: 3 },
        wName: (c) => ({ fontSize: 20, fontWeight: 700, letterSpacing: "-0.3px", color: c }),
        badge: (c) => ({ display: "inline-block", fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", color: c, background: c + "22", borderRadius: 6, padding: "2px 8px", marginTop: 8 }),
        exCount: { fontSize: 13, color: "#666", marginTop: 4 },
        card: { background: "#16161E", borderRadius: 16, padding: "16px 18px", marginBottom: 10 },
        exName: { fontSize: 16, fontWeight: 600, marginBottom: 2 },
        exNotes: { fontSize: 12, color: "#555", marginBottom: 12, fontStyle: "italic" },
        colLbl: { fontSize: 10, color: "#333", textTransform: "uppercase", letterSpacing: "0.08em", textAlign: "center" },
        setRow: { display: "flex", alignItems: "center", gap: 8, marginBottom: 8 },
        setNum: { width: 22, fontSize: 12, color: "#444", textAlign: "center", flexShrink: 0 },
        inp: (done) => ({ flex: 1, background: "#0A0A0F", border: "1px solid #222230", borderRadius: 10, color: done ? "#444" : "#F0F0F5", fontSize: 15, padding: "9px 10px", textAlign: "center", outline: "none", fontFamily: "inherit", width: "100%" }),
        doneBtn: (done, c) => ({ width: 34, height: 34, borderRadius: 10, border: done ? "none" : "2px solid #222230", background: done ? c : "transparent", color: done ? "#fff" : "#333", fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.15s", fontFamily: "inherit" }),
        primaryBtn: (c) => ({ display: "block", width: "100%", padding: "16px", background: c, color: "#fff", border: "none", borderRadius: 16, fontSize: 16, fontWeight: 700, letterSpacing: "-0.2px", cursor: "pointer", fontFamily: "inherit", marginTop: 14 }),
        secondaryBtn: { display: "block", width: "100%", padding: "14px", background: "#1A1A22", color: "#666", border: "none", borderRadius: 16, fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", marginTop: 8 },
        textarea: { width: "100%", background: "#0A0A0F", border: "1px solid #222230", borderRadius: 12, color: "#F0F0F5", fontSize: 14, padding: "12px 14px", outline: "none", fontFamily: "inherit", resize: "none" },
        backBtn: { background: "none", border: "none", color: "#666", fontSize: 15, cursor: "pointer", fontFamily: "inherit", padding: "0 0 12px 0", display: "flex", alignItems: "center", gap: 4 },
        nav: { position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "#0D0D14ee", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", borderTop: "1px solid #1A1A24", display: "flex", paddingBottom: "env(safe-area-inset-bottom, 16px)", paddingTop: 8 },
        navBtn: (active) => ({ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, background: "none", border: "none", cursor: "pointer", color: active ? "#F0F0F5" : "#3A3A4A", fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", fontFamily: "inherit", padding: "6px 0" }),
        toast: { position: "fixed", bottom: 110, left: "50%", transform: "translateX(-50%)", background: "#22C55E", color: "#fff", padding: "10px 22px", borderRadius: 20, fontSize: 14, fontWeight: 600, zIndex: 100, whiteSpace: "nowrap", boxShadow: "0 4px 20px #22C55E44" },
        histCard: (c) => ({ background: "#16161E", borderRadius: 16, padding: "14px 18px", marginBottom: 10, cursor: "pointer", borderLeft: `3px solid ${c}` }),
        histDate: { fontSize: 11, color: "#444", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 3 },
        histName: (c) => ({ fontSize: 17, fontWeight: 600, color: c, marginBottom: 4 }),
        histMeta: { fontSize: 13, color: "#555" },
        progressBar: { background: "#1A1A24", borderRadius: 6, height: 4, marginTop: 14 },
        progressFill: (pct, c) => ({ width: `${pct}%`, background: c, height: 4, borderRadius: 6, transition: "width 0.3s" }),
        progressLbl: { fontSize: 12, color: "#444", marginTop: 5 },
        tipRow: { display: "flex", gap: 10, marginBottom: 10, alignItems: "flex-start" },
        tipBullet: (c) => ({ color: c, fontSize: 11, marginTop: 3, flexShrink: 0 }),
        tipText: { fontSize: 13, color: "#888", lineHeight: 1.55 },
      };

      const NavBar = ({ current }) => (
        <nav style={css.nav}>
          {[["🏠", "home", "Home"], ["📋", "history", "Log"]].map(([icon, sc, label]) => (
            <button key={sc} style={css.navBtn(current === sc)} onClick={() => setScreen(sc)}>
              <span style={{ fontSize: 24 }}>{icon}</span>{label}
            </button>
          ))}
        </nav>
      );

      // ── WORKOUT SCREEN ──────────────────────────────────────────────────────
      if (screen === "workout" && w) {
        const totalSets = WORKOUTS[activeWorkout].exercises.reduce((a, e) => a + e.sets, 0);
        const doneSets = Object.values(completedSets).filter(Boolean).length;
        const pct = Math.round((doneSets / totalSets) * 100);

        return (
          <div style={css.app}>
            <div style={{ ...css.header, borderBottom: "1px solid #14141C" }}>
              <div style={css.label}>{w.day} · {w.focus} Focus</div>
              <div style={{ ...css.title, color: accent }}>{activeWorkout}</div>
              <div style={css.progressBar}><div style={css.progressFill(pct, accent)} /></div>
              <div style={css.progressLbl}>{doneSets} / {totalSets} sets completed · {pct}%</div>
            </div>

            <div style={{ padding: "14px 14px 0" }}>
              {WORKOUTS[activeWorkout].exercises.map((ex, i) => (
                <div key={i} style={css.card}>
                  <div style={css.exName}>{ex.name}</div>
                  {ex.notes && <div style={css.exNotes}>{ex.notes}</div>}
                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                    <div style={{ width: 22 }} />
                    <div style={{ ...css.colLbl, flex: 1 }}>kg</div>
                    <div style={{ ...css.colLbl, flex: 1 }}>reps</div>
                    <div style={{ width: 34 }} />
                  </div>
                  {Array.from({ length: ex.sets }, (_, j) => {
                    const key = `${i}-${j}`;
                    const done = !!completedSets[key];
                    return (
                      <div key={j} style={css.setRow}>
                        <div style={css.setNum}>{j + 1}</div>
                        <input style={css.inp(done)} placeholder="kg" type="number" inputMode="decimal"
                          value={sessionData[i]?.[j]?.weight || ""}
                          onChange={e => updateSet(i, j, "weight", e.target.value)} />
                        <input style={css.inp(done)} placeholder={ex.reps} type="number" inputMode="decimal"
                          value={sessionData[i]?.[j]?.reps || ""}
                          onChange={e => updateSet(i, j, "reps", e.target.value)} />
                        <button style={css.doneBtn(done, accent)} onClick={() => toggleSetDone(i, j)}>
                          {done ? "✓" : ""}
                        </button>
                      </div>
                    );
                  })}
                </div>
              ))}

              <div style={css.card}>
                <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, color: "#888" }}>Session Notes</div>
                <textarea style={css.textarea} rows={3}
                  placeholder="PRs, energy levels, adjustments..."
                  value={sessionNote}
                  onChange={e => setSessionNote(e.target.value)} />
              </div>

              <button style={css.primaryBtn(accent)} onClick={finishWorkout}>Save Session</button>
              <button style={css.secondaryBtn} onClick={() => setScreen("home")}>Discard</button>
              <div style={{ height: 20 }} />
            </div>
            {toast && <div style={css.toast}>{toast}</div>}
          </div>
        );
      }

      // ── SESSION DETAIL ──────────────────────────────────────────────────────
      if (screen === "session" && viewSession) {
        const wColor = WORKOUTS[viewSession.workout]?.color || "#FF6B35";
        return (
          <div style={css.app}>
            <div style={css.header}>
              <button style={css.backBtn} onClick={() => setScreen("history")}>← Back</button>
              <div style={css.label}>{viewSession.date}</div>
              <div style={{ ...css.title, color: wColor }}>{viewSession.workout}</div>
            </div>
            <div style={{ padding: "10px 14px" }}>
              {viewSession.note && (
                <div style={{ ...css.card, borderLeft: `2px solid ${wColor}`, marginBottom: 14 }}>
                  <div style={{ fontSize: 11, color: "#444", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>Notes</div>
                  <div style={{ fontSize: 14, color: "#aaa", lineHeight: 1.6 }}>{viewSession.note}</div>
                </div>
              )}
              {viewSession.exercises.map((ex, i) => (
                <div key={i} style={css.card}>
                  <div style={{ ...css.exName, marginBottom: 10 }}>{ex.name}</div>
                  {ex.sets.map((set, j) => (
                    <div key={j} style={{ display: "flex", gap: 10, marginBottom: 6, alignItems: "center" }}>
                      <div style={css.setNum}>{j + 1}</div>
                      <div style={{ flex: 1, textAlign: "center", fontSize: 15, color: set.weight ? "#F0F0F5" : "#2A2A35" }}>
                        {set.weight ? `${set.weight} kg` : "—"}
                      </div>
                      <div style={{ flex: 1, textAlign: "center", fontSize: 15, color: set.reps ? "#F0F0F5" : "#2A2A35" }}>
                        {set.reps ? `${set.reps} reps` : "—"}
                      </div>
                    </div>
                  ))}
                </div>
              ))}
              <div style={{ height: 20 }} />
            </div>
          </div>
        );
      }

      // ── HISTORY SCREEN ──────────────────────────────────────────────────────
      if (screen === "history") {
        const sessions = recentSessions();
        return (
          <div style={css.app}>
            <div style={css.header}>
              <div style={css.label}>Training Log</div>
              <div style={css.title}>History</div>
            </div>
            <div style={{ padding: "10px 14px" }}>
              {sessions.length === 0 ? (
                <div style={{ textAlign: "center", color: "#333", padding: "70px 20px" }}>
                  <div style={{ fontSize: 40, marginBottom: 16 }}>🏋️</div>
                  <div style={{ fontSize: 16, color: "#444" }}>No sessions yet</div>
                  <div style={{ fontSize: 13, color: "#333", marginTop: 8 }}>Complete your first workout to see it here</div>
                </div>
              ) : sessions.map((s2, i) => {
                const wColor = WORKOUTS[s2.workout]?.color || "#FF6B35";
                const setsTotal = s2.exercises.reduce((a, e) => a + e.sets.length, 0);
                const setsLogged = s2.exercises.reduce((a, e) => a + e.sets.filter(s => s.weight || s.reps).length, 0);
                return (
                  <div key={i} style={css.histCard(wColor)} onClick={() => { setViewSession(s2); setScreen("session"); }}>
                    <div style={css.histDate}>{s2.date}</div>
                    <div style={css.histName(wColor)}>{s2.workout}</div>
                    <div style={css.histMeta}>{setsLogged}/{setsTotal} sets logged · {s2.exercises.length} exercises</div>
                    {s2.note && <div style={{ fontSize: 12, color: "#444", marginTop: 6, fontStyle: "italic" }}>"{s2.note.slice(0, 70)}{s2.note.length > 70 ? "…" : ""}"</div>}
                  </div>
                );
              })}
              <div style={{ height: 20 }} />
            </div>
            <NavBar current="history" />
          </div>
        );
      }

      // ── HOME SCREEN ─────────────────────────────────────────────────────────
      return (
        <div style={css.app}>
          <div style={css.header}>
            <div style={css.label}>Upper / Lower Split</div>
            <div style={css.title}>Train</div>
          </div>
          <div style={{ padding: "10px 14px" }}>
            <div style={css.statRow}>
              <div style={css.stat}>
                <div style={css.statNum("#FF6B35")}>{totalSessions()}</div>
                <div style={css.statLbl}>Sessions</div>
              </div>
              <div style={css.stat}>
                <div style={css.statNum("#4ECDC4")}>{monthCount()}</div>
                <div style={css.statLbl}>This Month</div>
              </div>
              <div style={css.stat}>
                <div style={css.statNum("#A855F7")}>4</div>
                <div style={css.statLbl}>Days / Wk</div>
              </div>
            </div>

            <div style={css.sectionTitle}>This Week</div>
            {Object.entries(WORKOUTS).map(([name, wk]) => (
              <div key={name} style={css.wCard(wk.color)} onClick={() => startWorkout(name)}>
                <div style={css.dayLbl}>{wk.day}</div>
                <div style={css.wName(wk.color)}>{name}</div>
                <div style={css.exCount}>{wk.exercises.length} exercises</div>
                <span style={css.badge(wk.color)}>{wk.focus} Focus</span>
              </div>
            ))}

            <div style={css.sectionTitle}>Protocol Rules</div>
            <div style={{ ...css.card, borderLeft: "2px solid #FF6B3544" }}>
              {[
                ["Keep the weight on the bar — don't drop load during the cut", "#FF6B35"],
                ["Stop 1–2 reps short of failure to manage cortisol", "#4ECDC4"],
                ["Cap sessions at 45–55 min max", "#A855F7"],
                ["Log every lift — a 20% drop in weight is a warning sign", "#22C55E"],
              ].map(([tip, c], i) => (
                <div key={i} style={{ ...css.tipRow, marginBottom: i < 3 ? 10 : 0 }}>
                  <div style={css.tipBullet(c)}>▸</div>
                  <div style={css.tipText}>{tip}</div>
                </div>
              ))}
            </div>
          </div>
          <NavBar current="home" />
          {toast && <div style={css.toast}>{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
